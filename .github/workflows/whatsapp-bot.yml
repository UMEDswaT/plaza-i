name: WhatsApp bot checks

on:
  push:
    branches:
      - main
      - codex/plaza-i-whatsapp-bot
    paths:
      - "whatsapp-bot/**"
      - ".github/workflows/whatsapp-bot.yml"
  pull_request:
    paths:
      - "whatsapp-bot/**"
      - ".github/workflows/whatsapp-bot.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: whatsapp-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whatsapp-bot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify Python syntax
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m pytest -q
